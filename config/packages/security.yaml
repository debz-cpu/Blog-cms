security:
    # 🔐 Password hashing
    password_hashers:
        App\Entity\User:
            algorithm: auto

    # 👤 User provider (load user by email)
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # 🔥 Firewalls
    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            custom_authenticator: App\Security\LoginAuthenticator

            logout:
                path: app_logout
                target: app_login   # redirect after logout

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800   # 7 days
                path: /
                # always_remember_me: true

    # 🔒 Access control (who can access what)
    access_control:
        # allow public pages
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }

        # protect everything else
        - { path: ^/, roles: ROLE_USER }

# 🧪 Test environment (faster hashing)
when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10